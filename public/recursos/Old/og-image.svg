<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#030303"/>
  
  <!-- Gradient Overlay -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f2ff;stop-opacity:0.2" />
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#030303;stop-opacity:0" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#gradient1)"/>
  
  <!-- Accent Circle -->
  <circle cx="600" cy="315" r="200" fill="#00f2ff" fill-opacity="0.1"/>
  <circle cx="600" cy="315" r="150" fill="#7c3aed" fill-opacity="0.1"/>
  
  <!-- Text Content -->
  <text x="600" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff">
