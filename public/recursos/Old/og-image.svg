  </text>
  
  <text x="600" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="normal" fill="#ffffff" fill-opacity="0.7">
    Portafolio & CV
  </text>
  
  <!-- URL -->
  <text x="600" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#ffffff" fill-opacity="0.5">
