    <style>
        /* ===== Tokens ===== */
        :root {
            --accent: #00f2ff;
            --accent-dark: #0066ff;
            --accent-secondary: #7c3aed;
            --bg: #030308;
            --text: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        /* ===== Base ===== */
        *, *::before, *::after { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        ::selection { background: #06b6d4; color: #fff; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
        img { max-width: 100%; display: block; }
        a { color: inherit; }
        a:focus-visible, button:focus-visible, [tabindex]:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
            border-radius: 4px;
        }
        #inicio, #sobre-mi, #proyectos, #contacto { scroll-margin-top: 120px; }

        /* ===== Fondo tecnológico ===== */
        #canvas-container {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at 50% 50%, #0a0a1a 0%, #030303 100%);
        }
        .glow-sphere {
            position: absolute;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(0,242,255,.05) 0%, rgba(0,102,255,.02) 50%, transparent 70%);
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            transition: transform 0.25s ease-out;
            will-change: transform;
        }
